name = "__NAME__"
description = "One line that says what this stack gives the user"
category = "__CATEGORY__"
tags = ["__NAME__"]
upstream_docs = "https://example.org/docs"
maintained_by = ["__MAINTAINER__"]
notes = ""

[[ports]]
service = "app"
host = 8080
container = 8080
bind = "127.0.0.1"
description = "Web UI"

[[volumes]]
name = "app_data"
description = "Application data"

[healthcheck]
services = ["app"]
# exempt = { worker = "Explain why this service cannot have a healthcheck" }

[env.BIND_ADDRESS]
description = "Interface for published ports (127.0.0.1 = only reachable through a reverse proxy or SSH tunnel)"
default = "127.0.0.1"

[env.APP_PORT]
description = "Host port for the web UI"
default = "8080"

[env.APP_SECRET]
description = "Session signing secret"
secret = true
generate = "hex:32"
