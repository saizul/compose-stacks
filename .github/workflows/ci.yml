name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: README stack table is up to date
        run: python scripts/gen_readme.py --check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: Validate every stack (offline)
        run: compose-stacks validate --all --strict --format github
      - name: CLI smoke test
        run: |
          compose-stacks --version
          compose-stacks list
          compose-stacks list --format json > stacks.json
          python -c "import json; assert len(json.load(open('stacks.json'))) >= 15"
          compose-stacks search postgres
          compose-stacks show wordpress
          compose-stacks init wordpress "$RUNNER_TEMP/wp"
          test -s "$RUNNER_TEMP/wp/.env"
          ! grep -q '^WORDPRESS_DB_PASSWORD=$' "$RUNNER_TEMP/wp/.env"
          python examples/list-as-json.py > /dev/null

  compose-config:
    name: docker compose config (all stacks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - run: docker compose version
      - name: Validate with docker compose config
        run: compose-stacks validate --all --require-docker --format github

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t compose-stacks:ci .
      - run: docker run --rm compose-stacks:ci --version
      - run: docker run --rm compose-stacks:ci validate --all --strict
      - run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/out:/work" compose-stacks:ci init redis /work/redis
          test -s "$RUNNER_TEMP/out/redis/.env"
