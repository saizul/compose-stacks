name: Bug report
description: A stack does not start, a healthcheck fails or the CLI misbehaves
labels: ["bug"]
body:
  - type: input
    id: stack
    attributes:
      label: Stack or command
      placeholder: "nextcloud / compose-stacks validate --all"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact commands and the output. Remove passwords and tokens.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of: compose-stacks --version; docker version --format '{{.Server.Version}}'; docker compose version"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: "Ubuntu 24.04, arm64"
