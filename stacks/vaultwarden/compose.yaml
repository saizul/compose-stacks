# Vaultwarden: lightweight server compatible with Bitwarden clients.
# HTTPS is mandatory for the web vault and clients: run it behind a TLS proxy.

services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vault.example.com}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SHOW_PASSWORD_HINT: "false"
      IP_HEADER: X-Forwarded-For
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VAULTWARDEN_PORT:-8222}:80"
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  vaultwarden_data:
