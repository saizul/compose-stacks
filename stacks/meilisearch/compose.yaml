# Meilisearch: fast, typo-tolerant search engine in production mode.

services:
  meilisearch:
    image: getmeili/meilisearch:v1.57.0
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1GiB}
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-INFO}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  meili_data:
