# Uptime Kuma 2: self-hosted uptime monitoring with status pages.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s

volumes:
  uptime_kuma_data:
