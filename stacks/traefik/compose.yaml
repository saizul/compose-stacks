# Traefik v3 reverse proxy with automatic Let's Encrypt certificates.
# Other stacks join the shared "proxy" network and opt in with labels.
# The dashboard listens on 127.0.0.1:8080 only (use an SSH tunnel).

services:
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${TRAEFIK_NETWORK:-proxy}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=${TRAEFIK_ACCESS_LOG:-false}
      - --global.sendanonymoususage=false
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Demo service: https://${WHOAMI_HOST}. Remove it once your own apps are routed.
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    profiles: ["demo"]
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`${WHOAMI_HOST:-whoami.example.com}`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.services.whoami.loadbalancer.server.port=80

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  letsencrypt:
