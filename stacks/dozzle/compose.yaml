# Dozzle: real-time log viewer for Docker containers (read-only by default).

services:
  dozzle:
    image: amir20/dozzle:v11.4.3
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_ACTIONS: ${DOZZLE_ENABLE_ACTIONS:-false}
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
